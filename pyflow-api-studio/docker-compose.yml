services:
  backend:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["./data:/app/data"]
    env_file: .env
    restart: unless-stopped
  frontend:
    build: .
    command: streamlit run frontend/app.py --server.address 0.0.0.0
    ports: ["127.0.0.1:8501:8501"]
    environment:
      PYFLOW_API_URL: http://backend:8000
    env_file: .env
    depends_on: [backend]
